name: Claude Code

# Trigger on issue and PR interactions
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only trigger for human users — prevent bot loops
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'claude') ||
        (github.event_name == 'issues' &&
          github.event.action != 'labeled' &&
          (contains(github.event.issue.body, '@claude') ||
          contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # Create commits and branches
      pull-requests: write   # Open and update PRs
      issues: write          # Comment on issues
      id-token: write        # Commit signing
      actions: read          # Read CI results

    steps:
      # ── Environment Setup ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Claude Code Action ─────────────────────────
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_commit_signing: true
          allowed_bots: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --allowedTools "
              Bash(gh:*),
              Bash(pretext build),
              Bash(git *),Bash(cat *),Bash(ls *),
              Bash(find *),Bash(grep *),
              Read,Edit,Write,MultiEdit"